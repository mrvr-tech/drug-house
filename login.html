<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siddheshwar Drug House - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <img src="assets/siddheshwar-drug-house-logo-v3.svg" alt="Siddheshwar Drug House logo">
            <h1>💊 Siddheshwar Drug House</h1>
            <p>Medical Wholesale &bull; Inventory & Vendor Management</p>
        </div>

        <div id="loginError" class="alert alert-danger" style="display: none; padding: 12px; margin-bottom: 18px; font-size: 0.9rem;"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" placeholder="Enter username or email" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <button type="submit" id="loginBtn" class="btn" style="width: 100%; border-radius: 8px; font-size: 1rem;">🔐 Login</button>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Auto-redirect if already logged in
        Auth.redirectIfAuthenticated();

        // Handle Login Submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorBox = document.getElementById('loginError');
            const submitBtn = document.getElementById('loginBtn');

            errorBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Authenticating...';

            try {
                const result = await Auth.login(usernameInput, passwordInput);
                window.location.href = result.redirectUrl;
            } catch (err) {
                console.error('Login failed:', err);
                errorBox.textContent = '❌ ' + (err.message || 'Invalid username or password.');
                errorBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = '🔐 Login';
            }
        });
    </script>
</body>
</html>
